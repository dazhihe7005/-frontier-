# 只读取已经扶正的数据，不能绕过 task1_perception_gate 读取倾斜原始坐标。
cloud_topic: "/mine_uav/task1/cloud_registered"
odom_topic: "/mine_uav/task1/odometry"

# SUPER 任务模式的原子目标/取消话题；原生点击模式仍可单独使用 /goal。
goal_command_topic: "/mine_uav/super/goal_command"
world_frame: "task1_planning"

# Task scheduler gate. If no scheduler is running, the decider keeps its
# backward-compatible default enabled=true; a latched scheduler message will
# override it when mission_scheduler is started.
mission_enable_topic: "/mine_uav/mission/goaf_enable"
# Reset to zero on every new mission epoch; publish the exact first goal ID
# only after SUPER accepts it. mission_scheduler uses this handshake before it
# raises auto_enable, so map warmup can never start OFFBOARD by itself.
initial_goal_accepted_topic: "/mine_uav/exploration/accepted_initial_goal_id"

# task1_perception_gate 已把 Fast-LIO2 点云和位姿调平到 task1_planning。
# 本节点仍严格拒绝其他坐标系，避免把原始倾斜点云写进地图。
strict_cloud_frame: true

# 轻量 frontier 地图参数。SUPER 自己仍使用其 ROG-Map。
voxel_resolution: 0.25
max_map_radius: 40.0
raycast_max_range: 30.0
raycast_enable: true
max_points_per_cloud: 5000
# Task-one reachability keeps the 0.8 m planning floor so a narrow passage
# is still usable. Goal selection exhausts 1.1 m-clear candidates and
# segments before falling back to the 0.8--1.1 m band, matching SUPER.
# The command bridge independently enforces the smaller 0.65 m hard cylinder.
vehicle_radius: 0.8
preferred_vehicle_radius: 1.1
vertical_vehicle_clearance_below: 0.5
vertical_vehicle_clearance_above: 0.5
# Simulation-only recovery for accumulated-map pose/voxel jitter. A
# collision-enabled simulated aircraft proves its current swept envelope is
# free. Keep false for real localization, where pose error must never erase a
# physical obstacle.
carve_traversed_vehicle_envelope: false

# Occupancy evidence hysteresis: isolated endpoint noise must not permanently
# sever a physically open tunnel. Persistent surfaces still become occupied.
occupied_hit_increment: 2
free_ray_decrement: 1
occupied_confirm_threshold: 4
free_confirm_threshold: 0
occupancy_evidence_min: -6
occupancy_evidence_max: 8

# Real/SITL-safe persistence for the path actually traversed by the vehicle.
# This protects only the centerline, not the full 0.65 m collision envelope.
protect_traversed_centerline: true
traversed_centerline_radius: 0.35
traversed_centerline_step: 0.25

# Home在CH7允许任务时的空中悬停点捕获。无障碍时，任务级观察目标限于
# home -0.30 m 到 +0.20 m，并优先使用 cruise_height_above_home=0。
# 这只约束任务级普通目标；SUPER 遇障时仍可在三维安全走廊内上下绕行。
# 这是相对 home 的高度，不得再叠加起飞高度。
min_observation_height_above_home: -0.30
max_observation_height_above_home: 0.20

# 观察点选择与覆盖策略。
frontier_search_radius: 30.0
# 水平安全围栏；候选观察点不得离任务起点超过该距离。
max_exploration_radius_from_home: 35.0
min_goal_distance: 2.0
candidate_spacing: 3.0
min_unknown_neighbors: 1
information_weight: 1.0
distance_weight: 0.35

# 任务一方向策略：优先选择当前机头前方的 frontier。
# 角度均以调平后的 task1_planning 坐标系中的机体 yaw 为基准。
heading_priority_weight: 4.0
fallback_heading_weight: 0.75
# Surveyed worlds may define a fixed map-axis heading. Keep this disabled for
# real flights and generic worlds, where the heading is captured from the
# vehicle attitude plus mission_heading_offset.
use_absolute_mission_heading: false
absolute_mission_heading_yaw: 0.0
forward_sector_deg: 70.0
side_wall_sector_deg: 50.0
side_wall_min_range: 1.0
side_wall_max_range: 12.0
# Conditional medial-axis guidance. Both wall slices must remain stable for
# three scans; a missing wall, frontal blockage or discontinuous center jump
# releases the preference so turns, branches and local detours remain free.
corridor_centering_enabled: true
corridor_centering_min_wall_points: 12
corridor_centering_confirm_frames: 3
corridor_centering_release_frames: 3
corridor_centering_max_width: 6.0
corridor_centering_filter_gain: 0.25
corridor_centering_max_center_jump: 0.75
# Move a short goal toward the measured medial axis by at most 0.5 m per
# handover. With stable two-wall evidence this medial axis outranks comfort
# clearance for goal/path selection. If centering is unavailable, exhaust the
# 1.1 m comfort envelope before falling back to the 0.8 m planning floor.
corridor_centering_max_goal_shift: 0.5
# Build a distance-indexed free-space profile instead of collapsing all wall
# returns into one median. A connected narrowing up to 8 m ahead can bias the
# next short goal by 1 m, so yaw and lateral alignment begin before the throat.
corridor_preview_enabled: true
corridor_preview_start_distance: 1.0
corridor_preview_distance: 8.0
corridor_preview_longitudinal_step: 0.5
corridor_preview_lateral_half_width: 4.0
corridor_preview_lateral_step: 0.25
corridor_preview_max_lateral_slope: 1.0
corridor_preview_min_slices: 6
corridor_preview_min_center_shift: 0.25
corridor_preview_min_width_contraction: 0.5
corridor_preview_max_goal_shift: 1.0
front_obstacle_range: 6.0
# Side-wall relief can fill the narrow forward cone near the entrance. It may
# remain a local SUPER obstacle, but cannot be classified as the terminal wall
# until the aircraft has reached the map-closure minimum progress.
front_obstacle_min_progress: 8.0
# Narrow center cone used only for confirming the closed end wall. Frontier
# selection continues to use forward_sector_deg above.
front_obstacle_sector_deg: 24.0
# A closed wall must be a surface, not a single return. Requiring population
# and 2-D extent rejects ground slices, dust speckles and isolated supports.
front_obstacle_min_points: 20
front_obstacle_min_lateral_span: 1.0
front_obstacle_min_vertical_span: 0.8
# While either side wall is visible, keep task-level goals in the entry-axis
# corridor. SUPER may still deviate locally around an obstacle.
forward_corridor_half_width: 4.0
# Width searched by ordinary forward look-ahead goals.
forward_goal_lateral_search_width: 4.0
# Do not flip between left/right routes for small scan-to-scan clearance
# changes. Switch sides only when the alternative complete path gains at
# least this much minimum clearance.
lateral_route_switch_clearance_advantage: 0.25
# All task-level frontier goals, including fallback goals, must stay inside
# this corridor measured from the mission-start heading axis. The latest real
# flight reached lateral=-2 m before seeing a right-hand passage about 6 m
# wide; the former +/-4 m band discarded that opening before the verified
# lateral-detour check could use it.
max_task_lateral_offset: 10.0
forward_progress_weight: 2.0
forward_lateral_penalty: 2.0
forward_height_penalty: 1.0
# Hand the next short segment to SUPER with two metres still available, so a
# successful handover preserves motion without replacing the goal too early.
forward_goal_handover_distance: 2.0
# Keep task-level planning local. A remote frontier still selects the branch,
# while SUPER receives at most a four-metre, currently verified segment and
# remains responsible for collision-free local deviations within that segment.
forward_lookahead_distance: 4.0
# A remote frontier expresses a direction, not a single long trajectory.
# Convert it to a short, directly verified segment before handing it to SUPER.
max_frontier_goal_distance: 4.0
max_frontier_goal_vertical_step: 0.5
forward_lookahead_step: 0.5
# Cache only task-level hints for normal outbound flight. SUPER still receives
# one goal at a time, and each queued leg is checked again on the newest task
# map and SUPER occupancy immediately before handover.
exploration_goal_queue_enabled: true
exploration_goal_queue_max_future_goals: 3
exploration_goal_queue_horizon: 10.0
exploration_goal_queue_spacing: 2.5
# Do not pre-commit the queue all the way to the current observed boundary.
exploration_goal_queue_end_reserve: 1.0
cruise_height_above_home: 0.0
return_breadcrumb_spacing: 1.0
super_occupied_topic: "/fsm_node/rog_map/occ"
# Short live-map segments let SUPER retain a feasible local corridor. The
# surveyed outbound lane is preferred; a verified detour is still allowed.
return_segment_length: 1.5
return_goal_handover_distance: 2.0
# Return goals stay below the observation ceiling by default. A scenario can
# set a smaller cap to leave room below its bridge flight-volume limit.
return_map_timeout: 2.0
# Return-path proximity screening uses the 0.8 m planning floor. The live
# command bridge remains the final 0.65 m cylindrical hard-clearance authority.
return_clearance_margin: 0.0
return_super_radius: 0.8
# Only points near the vehicle height count as wall-direction evidence. This
# prevents a low-flying vehicle from classifying the mine ceiling as a frontal
# obstacle while preserving side-wall returns around the lidar horizon.
directional_vertical_tolerance: 1.5
directional_floor_exclusion: 0.5
side_wall_missing_confirm_frames: 8
front_obstacle_confirm_frames: 3

# 任务完成采用地图闭合判据，不再要求识别三面墙。飞机深入到安全距离后，
# 只有前向边界闭合、任务走廊内无可执行前沿、占据地图停止显著增长，并连续
# 多周期满足条件，才发布 model_complete 并返航。
require_three_wall_completion: false
use_map_closure_completion: true
map_closure_min_progress: 8.0
map_closure_no_frontier_time: 4.0
map_closure_stable_time: 4.0
map_closure_max_actionable_frontiers: 0
# Decision voxels fluctuate while Gazebo/SLAM pose jitters. Treat smaller
# increases or decreases in occupied count as noise during the stable window.
map_closure_growth_voxels: 500
map_closure_confirm_cycles: 4
map_closure_require_front_boundary: true
# Optional scenario recovery: after a confirmed dead end with no body-clear
# detour, reverse the task heading and backtrack through already observed free
# space. If the other direction also closes with no actionable frontier, the
# bidirectional connected component is complete. Task one enables one such
# recovery attempt; further dead ends still use the normal closure/return path.
# When the live map confirms that the current branch has no forward passage or
# lateral frontier, backtrack on the verified map and try the opposite heading
# once instead of waiting stationary for final map-closure timeout.
max_dead_end_heading_reversals: 1
dead_end_reversal_delay: 4.0
# Reachability flood-fill and candidate clustering are safety/CPU limits, not
# assumptions about mine dimensions.
max_reachable_voxels: 300000
max_frontier_candidates: 500

# 以下三面墙指标只保留为诊断数据，不参与默认完成决策。
wall_coverage_bin_size: 1.0
wall_coverage_min_depth: 8.0
# 末端墙必须距任务入口至少12 m，过滤入口平台边缘等近场结构。
wall_coverage_end_min_depth: 12.0
wall_coverage_min_ratio: 0.80
wall_coverage_max_gap_bins: 2
# 末端墙横向点云允许的最大空洞；与左右墙纵向连续性分开调节。
wall_coverage_end_max_gap_bins: 2
wall_coverage_side_min_distance: 1.5
wall_coverage_side_max_distance: 8.0
# 排除地面和顶板，只用中间高度的占据体素判断墙面连续性。
wall_coverage_min_height: 0.3
wall_coverage_max_height: 3.0
# 尽头墙必须包含中部回波并具备足够横向跨度，避免把两条侧墙误判为尽头墙。
wall_coverage_end_min_span: 4.0
wall_coverage_end_center_half_width: 1.0
wall_coverage_end_approach_distance: 6.0
# 当雷达已经看见完整尽头、普通frontier消失但飞机仍太远时，主动生成一个
# 距尽头墙该距离的观察点，保证任务真正推进到采空区深处。
wall_coverage_end_standoff_distance: 3.0
three_wall_confirm_cycles: 4

goal_reached_distance: 1.0
goal_timeout: 30.0

# 完成前至少到达一个观察点。只要已经产生实际运动，连续 10 秒没有任何可执行的
# 硬安全探索路段就开始实时地图返航；严格完成策略关闭时它也兼作无 frontier 完成门。
min_goals_before_complete: 1
min_data_duration: 5.0
no_frontier_timeout: 10.0

# 健康检查和任务事件。
decision_rate: 2.0
data_timeout: 1.0
# Keep an active SUPER trajectory through a brief synchronized-cloud gap.
# No fresh frontier or return goal is issued until new cloud data arrives.
active_goal_data_grace: 6.0
sync_queue_size: 20
sync_slop: 0.08
battery_return_threshold: 0.20
# Percentage estimates are quantized and can touch exactly 20% for one sample.
# Require a sustained low reading; the independent voltage threshold below
# remains an immediate, latched return trigger.
battery_return_confirm_duration: 3.0
battery_return_hysteresis: 0.03
battery_return_voltage: 21.6
# Real and SITL missions capture home after reaching an airborne hover, so
# return to the same task-start altitude.
return_home_height_offset: 0.0
return_max_height_above_home: 0.20
battery_topic: "/mavros/battery"
return_request_topic: "/mine_uav/exploration/return_home"
obstacle_replan_topic: "/mine_uav/exploration/obstacle_replan"

status_topic: "/mine_uav/exploration/status"
finished_topic: "/mine_uav/exploration/finished"
returning_topic: "/mine_uav/exploration/returning"
model_complete_topic: "/mine_uav/exploration/model_complete"
coverage_status_topic: "/mine_uav/exploration/model_coverage"
visualization_topic: "/mine_uav/exploration/frontiers"
