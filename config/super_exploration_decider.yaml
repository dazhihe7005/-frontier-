# Fast-LIO2 的常见 ROS1 输出接口。
cloud_topic: "/cloud_registered"
odom_topic: "/Odometry"

# SUPER FsmRos1 默认订阅的目标话题。
goal_topic: "/goal"
world_frame: "camera_init"

# Task scheduler gate. If no scheduler is running, the decider keeps its
# backward-compatible default enabled=true; a latched scheduler message will
# override it when mission_scheduler is started.
mission_enable_topic: "/mine_uav/mission/goaf_enable"

# 本节点不做 TF 自动转换；实测 Fast-LIO2 点云与位姿均为 camera_init。
# 严格拒绝其他坐标系，避免把未转换点云写进地图。
strict_cloud_frame: true

# 轻量 frontier 地图参数。SUPER 自己仍使用其 ROG-Map。
voxel_resolution: 0.5
max_map_radius: 40.0
raycast_max_range: 40.0
raycast_enable: true
max_points_per_cloud: 5000
vehicle_radius: 0.35

# 观察点相对任务起点的高度范围。当前上限与 SUPER 的局部地图高度匹配；
# 正式飞行前应按巷道净高、雷达安装高度和安全裕量重新标定。
min_observation_height_above_home: 0.5
max_observation_height_above_home: 2.5

# 观察点选择与覆盖策略。
frontier_search_radius: 30.0
# 水平安全围栏；候选观察点不得离任务起点超过该距离。
max_exploration_radius_from_home: 35.0
min_goal_distance: 2.0
candidate_spacing: 3.0
min_unknown_neighbors: 1
information_weight: 1.0
distance_weight: 0.35

# 任务一方向策略：优先选择当前机头前方的 frontier。
# 角度均以 Fast-LIO2 camera_init 坐标系中的机体 yaw 为基准。
heading_priority_weight: 4.0
fallback_heading_weight: 0.75
forward_sector_deg: 70.0
side_wall_sector_deg: 50.0
side_wall_min_range: 1.0
side_wall_max_range: 12.0
front_obstacle_range: 6.0
# Narrow center cone used only for confirming the closed end wall. Frontier
# selection continues to use forward_sector_deg above.
front_obstacle_sector_deg: 24.0
# A closed wall must be a surface, not a single return. Requiring population
# and 2-D extent rejects ground slices, dust speckles and isolated supports.
front_obstacle_min_points: 20
front_obstacle_min_lateral_span: 1.0
front_obstacle_min_vertical_span: 0.8
# While either side wall is visible, keep task-level goals in the entry-axis
# corridor. SUPER may still deviate locally around an obstacle.
forward_corridor_half_width: 2.0
forward_progress_weight: 2.0
forward_lateral_penalty: 2.0
forward_height_penalty: 1.0
# Hand the next look-ahead goal to SUPER before reaching a full stop.
forward_goal_handover_distance: 3.0
# Forward mode samples a known-free task-level target this far ahead. The
# planner remains responsible for collision-free local deviations.
forward_lookahead_distance: 8.0
forward_lookahead_step: 0.5
cruise_height_above_home: 0.8
# Only points near the vehicle height count as wall-direction evidence. This
# prevents a low-flying vehicle from classifying the mine ceiling as a frontal
# obstacle while preserving side-wall returns around the lidar horizon.
directional_vertical_tolerance: 1.5
directional_floor_exclusion: 0.5
side_wall_missing_confirm_frames: 8
front_obstacle_confirm_frames: 3

# 采空区语义完成判据。以任务开始时的机头方向建立纵向/横向坐标，只有左右
# 侧墙从入口到尽头连续覆盖、尽头墙横向覆盖足够且飞机已接近尽头时才允许返航。
require_three_wall_completion: true
wall_coverage_bin_size: 1.0
wall_coverage_min_depth: 8.0
wall_coverage_min_ratio: 0.80
wall_coverage_max_gap_bins: 2
wall_coverage_side_min_distance: 1.5
wall_coverage_side_max_distance: 8.0
# 排除地面和顶板，只用中间高度的占据体素判断墙面连续性。
wall_coverage_min_height: 0.3
wall_coverage_max_height: 3.0
# 尽头墙必须包含中部回波并具备足够横向跨度，避免把两条侧墙误判为尽头墙。
wall_coverage_end_min_span: 4.0
wall_coverage_end_center_half_width: 1.0
wall_coverage_end_approach_distance: 6.0
# 当雷达已经看见完整尽头、普通frontier消失但飞机仍太远时，主动生成一个
# 距尽头墙该距离的观察点，保证任务真正推进到采空区深处。
wall_coverage_end_standoff_distance: 3.0
three_wall_confirm_cycles: 4

goal_reached_distance: 1.0
goal_timeout: 30.0

# 完成前至少到达一个观察点。启用三面墙判据后，无 frontier 超时只用于状态
# 观察，不再独立触发“建模完成”；关闭 require_three_wall_completion 才回退到旧判据。
min_goals_before_complete: 1
min_data_duration: 5.0
no_frontier_timeout: 15.0

# 健康检查和任务事件。
decision_rate: 2.0
data_timeout: 1.0
sync_queue_size: 20
sync_slop: 0.08
battery_return_threshold: 0.20
# Real missions normally capture home while already airborne, so this remains
# zero by default. Ground-started SITL overrides it to a safe hover height.
return_home_height_offset: 0.0
battery_topic: "/mavros/battery"
return_request_topic: "/mine_uav/exploration/return_home"

status_topic: "/mine_uav/exploration/status"
finished_topic: "/mine_uav/exploration/finished"
returning_topic: "/mine_uav/exploration/returning"
model_complete_topic: "/mine_uav/exploration/model_complete"
coverage_status_topic: "/mine_uav/exploration/model_coverage"
visualization_topic: "/mine_uav/exploration/frontiers"
