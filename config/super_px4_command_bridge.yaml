command_topic: /planning/pos_cmd
output_topic: /mine_uav/setpoint_cmd
# task1_perception_gate has already rotated map data and planner commands into
# this gravity-aligned frame.  Only the captured origin translation remains for
# the command bridge to apply.
alignment_topic: /mine_uav/task1/planning_to_px4_alignment
sensor_position_topic: /mine_uav/task1/lio_sensor_position_in_body
expected_frame: task1_planning

# SUPER commands must remain fresh. A timeout latches the operator gate off.
command_timeout: 0.25
local_pose_timeout: 0.5
output_rate: 50.0

# Current real-flight speed contract. Launch files may still apply a different
# limit for a deliberately isolated simulation.
max_speed: 1.1
max_measured_speed: 1.1
# Govern the velocity PX4's position loop will request, not just SUPER's
# feed-forward velocity. These gains must match the aircraft's MPC_XY_P and
# MPC_Z_P values. Routine limiting continues the task; a much larger tracking
# error remains a fault instead of being hidden by an extreme counter-command.
max_predicted_speed: 1.1
# Preserve headroom above the nominal 0.9 m/s SUPER trajectory instead of
# cutting its feed-forward term during normal cruise. If measured speed crosses
# the independent 1.1 m/s hard limit, keep governing for 1.5 continuous
# seconds; recover normally if speed returns to the safe range in that window.
measured_speed_target: 1.0
measured_speed_feedback_gain: 1.0
measured_speed_governor_floor: 0.35
measured_speed_governor_reduction_rate: 0.80
measured_speed_governor_recovery_rate: 0.50
overspeed_duration: 1.5
tracking_position_gain_xy: 0.75
tracking_position_gain_z: 1.0
max_governor_tracking_error: 0.65
# A vehicle behind a moving reference but still on the certified path has a
# trajectory-time lag, not a lateral safety breach. The strict non-lag limit
# above is unchanged; this bounded along-track envelope only permits governed
# recovery and matches the largest managed reacquisition distance below.
max_governor_along_track_lag: 1.5
# OFFBOARD may only engage from the same stable-hover envelope used by the
# five-metre operator. This is checked before the mode request, not afterward.
max_offboard_entry_speed: 0.30
max_acceleration: 1.25
# 0 disables the optional home-centred horizontal command fence. Production
# exploration ends on a verified terminal/no-route condition or low battery,
# not at a fixed distance. Bounded SITL scenarios may override this positively.
max_horizontal_radius: 0.0
# Height limits use the levelled task1_planning frame, before alignment into
# PX4 local coordinates. Keep these identical to SUPER flight_min_z/max_z so
# an inclined Task-4 route cannot be accepted by SUPER and rejected later by
# the command bridge merely because the per-flight alignment offset changed.
min_height: -5.0
max_height: 8.0
height_clamp_tolerance: 0.25
# Independent live obstacle guard. The cloud and task odometry share the
# gravity-aligned planning frame. Horizontal clearance and vertical relevance
# are evaluated separately. An intrusion immediately freezes a measured-pose
# hold. Only a persistent intrusion inside the independent 0.65 m hard radius
# may be promoted to an OFFBOARD exit.
obstacle_safety_enabled: true
obstacle_cloud_topic: /mine_uav/task1/cloud_registered
task_odometry_topic: /mine_uav/task1/odometry
obstacle_cloud_timeout: 0.35
# A short producer scheduling/timebase gap first performs a continuous brake
# and fixed OFFBOARD hold. Only a sustained loss exits to POSCTL. This exceeds
# Omni-LIVO's 0.5 s state-stale diagnostic threshold while remaining bounded.
obstacle_cloud_fault_timeout: 2.0
live_horizontal_clearance: 0.65
# Planning-floor monitoring radius. Any current return inside 0.8 m freezes one
# measured-pose hold immediately. It is not a hard-fault radius: a transient
# leaf/rock may clear and the current task then resumes smoothly.
obstacle_monitor_horizontal_clearance: 0.8
# Start a near-wall stop early enough for the stop trajectory the bridge will
# actually publish. At the 1.1 m/s contract, 0.25 s sensing/control reaction,
# a 1.75 m/s^2 emergency deceleration and 0.10 m reserve require about 1.55 m.
# The 1.7 m search cap leaves bounded estimator/packet headroom.
obstacle_dynamic_monitor_max_clearance: 1.7
obstacle_reaction_time: 0.25
obstacle_emergency_deceleration: 1.75
obstacle_emergency_min_duration: 0.25
obstacle_emergency_max_jerk: 30.0
obstacle_dynamic_clearance_buffer: 0.10
# Persistence in the 0.65--0.8 m monitored caution zone requests a fresh
# frontier/SUPER route instead of waiting forever; it does not exit OFFBOARD.
# The fixed hold is released only by a newly numbered trajectory. A persistent
# obstacle inside 0.65 m requests verified return while localization and the
# cloud remain healthy; that new trajectory must increase obstacle clearance.
# A cloud timeout remains an immediate exit because monitoring is unavailable.
# Five continuous 10 Hz observations are enough to start a verified replan.
# Replanning now overlaps the 1.5 s braking ramp instead of adding a three
# second stationary wait before avoidance begins.
obstacle_persistence_duration: 0.5
obstacle_replan_topic: /mine_uav/exploration/obstacle_replan
# Bounded time for the newly verified trajectory to leave the old soft zone.
# Hard 0.65 m collision protection remains active throughout this window.
obstacle_replan_escape_duration: 4.0
obstacle_clear_confirm_frames: 3
# Vertical cylinder measured from the aircraft centre: obstacle returns up to
# 0.5 m below and above remain horizontally protected.
live_vertical_clearance_below: 0.5
live_vertical_clearance_above: 0.5
# Remove only the task-frame ground support plane from obstacle-cylinder and
# surface-coverage checks. Real obstacle returns at/above z=0 stay protected.
obstacle_min_z: 0.0
# Do not approach a newly seen obstacle on a sparse edge/handful of returns.
# Three consecutive 10 Hz frames must describe a surface with the configured
# point count and horizontal extent. Coverage uses the same aircraft-relative
# vertical cylinder as collision monitoring plus a small estimator-drift
# margin; ceiling/floor returns outside that band cannot hold the aircraft.
# Incomplete evidence joins the
# same bounded hover-and-monitor state instead of causing an immediate exit.
coverage_guard_distance: 2.5
# Only the projected vehicle lane needs completeness gating. The independent
# 0.65/0.8 m cylinder still protects side walls at every bearing; using 2.5 m
# here made sparse side-wall returns freeze a clear forward trajectory.
coverage_lateral_half_width: 1.0
coverage_vertical_uncertainty_margin: 0.2
coverage_min_points: 30
# The 2026-10-26 panel produced a stable 0.52--0.60 m registered span. Keeping
# the threshold at exactly 0.60 m made readiness chatter and repeatedly pause
# and release while the aircraft continued toward it.
coverage_min_horizontal_span: 0.5
# A wall edge, post or low obstacle need not span 0.6 m vertically to be a
# complete surface. Point population and horizontal extent reject speckles.
coverage_min_vertical_span: 0.0
# Door jambs and posts in the 2026-10-27 flights produced 246--613 stable
# points and 1.2--1.39 m vertical span, but only 0.258--0.388 m horizontal
# span. Accept that distinct shape as complete evidence without changing the
# independent 0.65/0.8 m hard/planning clearance cylinders.
coverage_narrow_vertical_min_points: 120
coverage_narrow_vertical_min_horizontal_span: 0.2
coverage_narrow_vertical_min_vertical_span: 0.8
# Acquiring the door-jamb/post classification remains strict above. Once that
# geometry has been confirmed, retain it through the 49--101 point packets
# observed tonight. This does not bypass the dynamic 0.8--1.7 m live stop or
# the independent 0.65 m hard cylinder.
coverage_narrow_vertical_retain_min_points: 45
coverage_narrow_vertical_retain_min_horizontal_span: 0.1
coverage_narrow_vertical_retain_min_vertical_span: 0.7
coverage_confirm_frames: 3
coverage_reject_frames: 5
max_obstacle_points: 100000

# Continuity guard: reject discontinuous planner output before it can reach PX4.
max_yaw_rate: 0.75
max_position_rate: 1.10
max_velocity_slew: 1.75
max_acceleration_slew: 6.0
continuity_reset_gap: 0.30
continuity_nominal_dt: 0.01
reacquire_blend_duration: 3.5
max_initial_command_distance: 0.65
max_initial_yaw_error: 0.70
# Only after this bridge has deliberately pinned a fixed obstacle hold, allow
# a newly verified SUPER source to be farther than the ordinary first-command
# gate. It is never sent as a step: a rate-sized quintic begins at the exact
# published hold. Larger gaps remain held in OFFBOARD and request return.
max_managed_reacquire_distance: 1.5
max_managed_reacquire_yaw_error: 2.6
# Reject a restarted/re-aligned Omni-LIVO frame while an autonomous task is
# active. This is the full 3-D rotation threshold (radians), not yaw only.
max_alignment_rotation_change: 0.05
exploration_status_topic: "/mine_uav/exploration/status"
execution_authorization_topic: "/mine_uav/super/execution_enable"
use_acceleration: true

# Automatic control authorization comes from the mission scheduler (physical
# the selected exploration task). The bridge prestreams a hold target, then requests OFFBOARD.
auto_enable_topic: /mine_uav/mission/auto_enable
automatic_mode_switch: true
require_armed_for_offboard: true
prestream_duration: 1.0
# A transient speed estimate at the entry boundary restarts the stable
# prestream window instead of aborting the mission immediately. A vehicle that
# never settles still fails closed after this bounded wait.
prestream_stability_timeout: 15.0
# POSCTL remains under the pilot during prestream. Brief estimator scheduling
# jitter restarts the complete prestream window; a persistent loss still
# rejects the start within this bounded interval.
preoffboard_vision_recovery_timeout: 2.0
mode_request_interval: 1.0
offboard_mode: OFFBOARD
fallback_mode: POSCTL
return_recovery_timeout: 12.0
# 定位、MAVROS 和点云仍健康时，超过该时间不是退出条件：桥接器固定悬停并再次请求
# 验证返航。只有自主返航所需的健康条件失效才转入原有退出保护。

# The SetBool service remains as an optional software inhibit. RC operation does
# not require a service call when this default is true.
software_enable_default: true
