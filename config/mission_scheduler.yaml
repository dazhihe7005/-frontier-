# ROS channel indexes are zero-based: 5 means physical RC channel CH6.
# Set this to the actual two-position switch channel from QGroundControl.
rc_topic: "/mavros/rc/in"
rc_switch_channel: 5

# Independent automatic-control permission switch. ROS index 6 is physical
# CH7. High permits the selected task; low immediately forces HOLD/disabled.
auto_enable_channel: 6
auto_enable_threshold: 1700
auto_enable_stable_time: 0.5
# Refuse a switch that was already high when the node started. The operator
# must move it low once before automatic control can be enabled.
require_auto_enable_low_before_enable: true

# Low position selects task 1; high position selects task 2.
# Values in the middle band are treated as invalid and force HOLD.
low_threshold: 1300
high_threshold: 1700
switch_stable_time: 0.5
rc_timeout: 1.0

# Task 2 is deliberately blocked until the shaft controller is implemented and
# validated. Selecting it currently produces HOLD.
shaft_task_available: false

# Fast-LIO2 odometry health gate.
odometry_topic: "/Odometry"
odometry_timeout: 1.0
require_odometry: true

# Optional MAVROS connection health gate.
mavros_state_topic: "/mavros/state"
require_mavros_connection: true

decision_rate: 10.0

active_task_topic: "/mine_uav/mission/active_task"
auto_enable_topic: "/mine_uav/mission/auto_enable"
goaf_enable_topic: "/mine_uav/mission/goaf_enable"
shaft_enable_topic: "/mine_uav/mission/shaft_enable"
return_home_topic: "/mine_uav/mission/return_home"
switch_event_topic: "/mine_uav/mission/switch_event"
status_topic: "/mine_uav/mission/status"
