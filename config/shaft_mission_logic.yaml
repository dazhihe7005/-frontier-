# Task 2 logic-only prototype. No PX4 publisher is connected.
# Positive relative depth is downward; velocity intent uses ROS ENU (+z up).
# Required source/frame intentionally blank outside explicit SITL or test launch.
# Without a validated independent depth producer and downward sensor, no motion.
required_depth_source: ""
required_range_frame: ""
max_depth_sigma_m: 0.25
descent_speed: 0.5
return_speed: 0.5
# Downward laser: at <=5 m, decelerate immediately, confirm the reading, then
# reverse into the return leg. The laser is not an EKF input or depth source.
bottom_trigger: 5.0
bottom_stop_margin: 0.8
bottom_confirm_seconds: 0.3
max_depth: 450.0
max_duration: 1800.0
entrance_tolerance: 0.5
max_depth_jump: 2.0
max_acceleration: 0.5
input_timeout: 0.4
control_rate: 20.0
