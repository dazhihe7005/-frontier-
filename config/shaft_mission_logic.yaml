# Task 2 production sensor contract. The assisted-task router is the only
# component allowed to forward this node's vertical intent to PX4.
# Positive relative depth is downward; velocity intent uses ROS ENU (+z up).
required_depth_source: "omnilivo_planning_odometry"
required_range_frame: "sddm_down"
depth_topic: "/mine_uav/shaft/depth_estimate"
range_topic: "/mine_uav/task3/downward_range"
# The mission permits about 5 m accumulated entry-relative LIO depth error.
max_depth_sigma_m: 5.0
descent_speed: 0.5
return_speed: 0.5
# Downward SDDM: at <=10 m, decelerate immediately, confirm the reading, then
# reverse into the return leg. The laser is not an EKF input or depth source.
bottom_trigger: 10.0
bottom_stop_margin: 0.8
bottom_confirm_seconds: 0.3
max_depth: 450.0
max_duration: 1800.0
entrance_tolerance: 5.0
max_depth_jump: 2.0
max_acceleration: 0.5
input_timeout: 0.4
# SDDM long-range frames may be about 0.8 s apart. Depth/pose retains the
# independent 0.4 s watchdog; only downward range uses this 1.2 s window.
range_timeout: 1.2
control_rate: 20.0
