# Repository-owned SUPER profile for task one. Do not edit SUPER's upstream
# click_smooth_ros1.yaml for this project; all task-specific tuning lives here.
fsm:
  frame_id: "task1_planning"
  click_goal_en: false
  click_goal_topic: "/goal"
  goal_command_en: true
  goal_command_topic: "/mine_uav/super/goal_command"
  click_height: -10.0
  goal_snap_max_distance: 0.50
  click_yaw_en: true
  replan_rate: 6.0
  cmd_topic: "/planning/pos_cmd"
  mpc_cmd_topic: "/planning_cmd/poly_traj"
  timer_en: true

super_planner:
  backup_traj_en: true
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: false
  visual_process: false
  frontend_in_known_free: false
  goal_yaw_en: true
  goal_vel_en: false
  corridor_bound_dis: 1.5
  corridor_line_max_length: 1.2
  safe_corridor_line_max_length: 5.0
  iris_iter_num: 2
  obs_skip_num: 2
  # A* can use 0.8 s and corridor optimization needs additional time. At
  # 0.1 s valid return replans were discarded after searching.
  replan_forward_dt: 2.0
  planning_horizon: 7.0
  sensing_horizon: -1
  receding_dis: 4.0
  # Anisotropic safety contract: 0.8 m horizontal and 0.5 m vertical.
  # CIRI starts from the 0.5 m base sphere, then attempts a horizontal-only
  # 0.3 m inset. The front-end map is one 0.1 m grid cell stricter at 0.9 m
  # horizontally. Every optimized result is independently checked against
  # the exact 0.8 m hard
  # cylinder, so a locally infeasible CIRI inset cannot weaken acceptance.
  robot_r: 0.5
  horizontal_clearance_extra: 0.3
  clearance_vertical_band: 0.5
  # Independent finite-height cylinder checked against raw occupied voxels
  # after optimization. XY and Z are tested separately: while vertical
  # separation is below 0.5 m, it cannot reduce the required 0.8 m XY gap.
  horizontal_hard_clearance: 0.8
  horizontal_hard_vertical_half_height: 0.5
  # Task-frame ground returns are near z=-0.05 m. Keep their support plane
  # out of the vertical obstacle cylinders while retaining obstacle top/face
  # returns at z>=0.0 m (the latest real low obstacle reached z=0.065 m).
  horizontal_hard_min_obstacle_z: 0.0
  # Once a side is selected around a centerline obstacle, retain the required
  # lateral offset until the aircraft centre is beyond its far edge plus the
  # full hard radius. This prevents the 2026-10-15 early centerline cutback.
  prevent_premature_center_return: true
  centerline_obstacle_half_width: 1.2
  # Give the finer inflated grid a bounded search window in the return lane.
  astar_search_timeout: 0.8
  # Broad planner bounds shared by level and inclined simulated mines. Each
  # launch keeps its own tighter PX4 bridge fence; real flights still require
  # bounds converted from the measured PX4 alignment.
  flight_min_z: -5.0
  flight_max_z: 8.0
  yaw_dot_max: 0.6
  yaw_mode: 1
  mpc_horizon: 15

traj_opt:
  switch:
    save_log_en: false
    print_optimizer_log: false
  boundary:
    # Current flight contract: 0.6 m/s nominal planning, 0.7 m/s predicted
    # closed-loop governance, and 0.8 m/s planner/measured hard limits.
    max_vel: 0.6
    max_acc: 1.0
    max_jerk: 4.0
    max_omg: 2.5
    max_acc_thr: 20.0
    min_acc_thr: 6.0
    penna_margin: 0.15
  exp_traj:
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    scale_factor: 1.0
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: 5.0e+5
    penna_attract: 1.0e+3
    penna_omg: 5.0e+5
    penna_thr: 1.0e+5
  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: true
    opt_accuracy: 1.0e-6
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 1200.0
    penna_ts: 1.0e+5
    penna_pos: 1.0e+6
    penna_vel: 1.0e+5
    penna_acc: 1.0e+5
    penna_jerk: 1.0e+5
    penna_omg: 1.0e+5
    penna_thr: 1.0e+5
  flatness:
    # STEP-derived custom airframe total mass, including both batteries and
    # MID360S.  Keep the planner dynamics consistent with PX4/Gazebo.
    mass: 6.0
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81

astar:
  map_voxel_num: [500, 500, 100]
  visual_process: false
  allow_diag: true
  heu_type: 2
  debug_visualization_en: false
  # First search only inside a narrow band around the start-to-goal height
  # profile. That makes left/right bypass a hard first choice. Only if this
  # search has no route may A* retry upward. Only when that second search also
  # fails may the final fallback descend below the profile. A vertical step
  # costs twice a lateral step so either vertical fallback stays economical.
  lateral_bypass_first: true
  lateral_bypass_vertical_band: 0.15
  lateral_bypass_min_horizontal_span: 1.0
  vertical_bypass_up_only: true
  downward_bypass_last: true
  vertical_motion_cost: 2.0

rog_map:
  resolution: 0.1
  inflation_resolution: 0.1
  # The primary A* search reads the inflated map directly. Its neighbour
  # radius is used only by a fallback search, so zero inflation admitted
  # paths whose CIRI seed lines were under 0.8 m from obstacles. Nine 0.1 m
  # cells add one grid cell beyond the 0.8 m final hard radius. It is
  # not the acceptance limit: optimized trajectories are still checked
  # independently against the exact 0.8 m cylinder.
  # Vertical inflation implements the independent 0.5 m vertical clearance.
  # The former 0.2 m grid snapped some return targets more than 1 m away.
  inflation_step: 9
  inflation_vertical_step: 5
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [50, 50, 6]
  fix_map_origin: [0, 0, 0]
  frontier_extraction_en: false
  # These are broad, level task-frame limits, not the per-scenario PX4 fence.
  # The perception gate removes the fixed radar mounting tilt before planning.
  virtual_ceil_height: 9.0
  virtual_ground_height: -5.0
  load_pcd_en: false
  map_sliding:
    enable: true
    threshold: 0.3
  esdf:
    enable: false
    resolution: 0.1
    local_update_box: [5, 5, 3]
  robot_center_free_radius: 0.30
  ros_callback:
    enable: true
    # Only task-gated perception enters ROG-Map. Raw Fast-LIO2 remains
    # continuously available to PX4 localization and the scheduler.
    cloud_topic: "/mine_uav/task1/cloud_registered"
    odom_topic: "/mine_uav/task1/odometry"
    odom_timeout: 2.0
  visualization:
    enable: true
    # ROG consumes task-gated odometry and clouds after they have been levelled.
    # Publish occupancy and markers in that same task frame.
    frame_id: "task1_planning"
    use_dynamic_reconfigure: false
    time_rate: 2
    frame_rate: 0
    range: [15, 15, 4]
    frame_id: "task1_planning"
    pub_unknown_map_en: false
  intensity_thresh: -10
  point_filt_num: 1
  raycasting:
    # Return scans must be able to remove old occupied voxels after Fast-LIO
    # aligns a repeated tunnel section differently. Hit-only fusion kept both
    # copies forever and manufactured a sub-2 m throat near the launch pad.
    enable: true
    batch_update_size: 1
    local_update_box: [100, 100, 5]
    ray_range: [0.5, 100]
    p_min: 0.12
    # A repeatedly traversed empty cell clears within a few scans, while a
    # cell hit in the same scan remains occupied in ROG's update cache.
    p_miss: 0.35
    p_free: 0.45
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    unk_thresh: 1.0
